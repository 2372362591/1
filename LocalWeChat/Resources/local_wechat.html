function uid(prefix = 'id') { return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }
function deepClone(value) { return JSON.parse(JSON.stringify(value)); }
function esc(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
function icon(name, extra = '') { return `<svg class="icon ${extra}" aria-hidden="true"><use href="#i-${name}" xlink:href="#i-${name}"></use></svg>`; }

function randomItem(items) { return items[Math.floor(Math.random() * items.length)]; }
function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
function toast(message, duration = 2400) {
    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}
function fmtSize(bytes) {
    const size = Number(bytes) || 0;
    if (size < 1024) return size + ' B';
    if (size < 1048576) return (size / 1024).toFixed(size > 10240 ? 0 : 1) + ' KB';
    if (size < 1073741824) return (size / 1048576).toFixed(size > 10485760 ? 0 : 1) + ' MB';
    return (size / 1073741824).toFixed(1) + ' GB';
}
function pad(number) { return String(number).padStart(2, '0'); }
function fmtTime(timestamp) {
    if (!timestamp) return '';
    const date = new Date(timestamp), now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    const target = new Date(date.getFullYear(), date.getMonth(), date.getDate()).getTime();
    const days = Math.round((start - target) / 86400000);
    if (days === 0) return pad(date.getHours()) + ':' + pad(date.getMinutes());
    if (days === 1) return '昨天';
    if (days > 1 && days < 7) return ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][date.getDay()];
    if (date.getFullYear() === now.getFullYear()) return (date.getMonth() + 1) + '月' + date.getDate() + '日';
    return date.getFullYear() + '/' + (date.getMonth() + 1) + '/' + date.getDate();
}
function fmtFullTime(timestamp) {
    const date = new Date(timestamp);

}
function exportMedia(mediaId) {
    const media = mediaById(mediaId);
    if (!media) return toast('文件已不存在');
    const base64 = String(media.data).split(',').pop();
    if (!base64) return toast('文件内容为空');
    if (hasAndroid) {
        const requestId = uid('export');
        window.AndroidBridge.exportFile(requestId, media.name, media.type, base64);
        toast('正在导出到系统下载目录…');
    } else if (hasIOS) {
        const requestId = uid('export');
        window.webkit.messageHandlers.localBridge.postMessage({action:'exportFile',requestId,fileName:media.name,mimeType:media.type,base64Data:base64});
        toast('正在导出文件…');
    } else {
        const anchor = document.createElement('a');
        anchor.href = media.data;
        anchor.download = media.name;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        toast('已开始下载');
    }
}

function readAsDataURL(file) {

        const reader = new FileReader();

async function imageDataURL(file, original) {
    if (file.type === 'image/gif' || file.size < 900000) return {data:original,type:file.type || 'image/jpeg'};
    const image = await new Promise((resolve, reject) => {
        const element = new Image();
        element.onload = () => resolve(element);
        element.onerror = () => reject(new Error('图片解码失败'));
        element.src = original;
    });
    const ratio = Math.min(1,1600 / Math.max(image.naturalWidth,image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1,Math.round(image.naturalWidth * ratio));
    canvas.height = Math.max(1,Math.round(image.naturalHeight * ratio));
    const context = canvas.getContext('2d');
    context.drawImage(image,0,0,canvas.width,canvas.height);
    const type = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
    return {data:canvas.toDataURL(type,0.86),type};
}
async function importMediaFile(file) {

    let type = file.type || 'application/octet-stream';
    const isImage = type.startsWith('image/'), isVideo = type.startsWith('video/'), isAudio = type.startsWith('audio/');
    const limit = isVideo ? 209715200 : isImage ? 26214400 : isAudio ? 26214400 : 104857600;
    if (file.size > limit) throw new Error(`${file.name} 超过大小限制（${fmtSize(limit)}）`);
    let data = await readAsDataURL(file);
    if (isImage) {
        try { const processed = await imageDataURL(file,data); data = processed.data; type = processed.type; }
        catch (error) { console.warn('Using original image',error); }
    }
    const id = uid('media');

}

async function startVoiceRecording() {

        if (recordCancelRequested) { recordStream.getTracks().forEach(track => track.stop()); recordStream = null; return; }
        recordChunks = [];

        mediaRecorder.ondataavailable = event => { if (event.data.size) recordChunks.push(event.data); };
        mediaRecorder.onstop = async () => {
            const duration = Math.max(1,Math.round((Date.now() - recordStartedAt) / 1000));
            const blob = new Blob(recordChunks,{type:mediaRecorder.mimeType || 'audio/mp4'});
            recordStream?.getTracks().forEach(track => track.stop());

            mediaRecorder = null;

            const button = document.getElementById('voice-record'); if (button) button.textContent = '按住 说话';

                const file = new File([blob],'语音_' + Date.now() + '.' + extension,{type:blob.type || 'audio/mp4'});
                const mediaId = await importMediaFile(file);
                addMessage(chat.id,{sender:'me',type:'audio',mediaId,duration});
                commit();
                if (contactById(chat.contactId).kind === 'ai') sendAIResponse(chat.id); else scheduleLocalReply(chat.id,'[语音]');
            } catch (error) { toast('语音保存失败：' + error.message,3500); }
        };
        recordStartedAt = Date.now();
        mediaRecorder.start();
        const button = document.getElementById('voice-record');
        if (button) { button.classList.add('recording'); button.textContent = '松开 发送'; }
    } catch (error) {
        recordStream?.getTracks().forEach(track => track.stop());

async function extractVideoFrames(media, count = 3) {
    const video = document.createElement('video');
    video.muted = true; video.playsInline = true; video.preload = 'auto'; video.src = media.data;
    await new Promise((resolve,reject) => {
        const timer = setTimeout(() => reject(new Error('视频读取超时')),20000);
        video.onloadedmetadata = () => { clearTimeout(timer); resolve(); };
        video.onerror = () => { clearTimeout(timer); reject(new Error('当前视频格式无法解码')); };
    });
    const duration = Number.isFinite(video.duration) && video.duration > 0 ? video.duration : 1;
    const frames = [];
    for (let index = 0; index < count; index++) {
        const target = Math.min(duration - 0.05,Math.max(0.05,duration * (index + 1) / (count + 1)));
        await new Promise((resolve,reject) => {
            const timer = setTimeout(() => reject(new Error('视频抽帧超时')),12000);
            video.onseeked = () => { clearTimeout(timer); resolve(); };
            video.onerror = () => { clearTimeout(timer); reject(new Error('视频抽帧失败')); };
            video.currentTime = target;
        });
        const canvas = document.createElement('canvas');
        const ratio = Math.min(1,768 / Math.max(video.videoWidth || 768,video.videoHeight || 768));
        canvas.width = Math.max(1,Math.round((video.videoWidth || 768) * ratio));
        canvas.height = Math.max(1,Math.round((video.videoHeight || 768) * ratio));
        canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
        frames.push(canvas.toDataURL('image/jpeg',0.78));
    }
    video.removeAttribute('src'); video.load();
    return {frames,duration};
}
async function requestMediaText(allMessages) {
    const ai = state.settings.ai;
    let lastAssistant = -1;
    allMessages.forEach((message,index) => { if (message.sender === 'ai') lastAssistant = index; });
    const batch = allMessages.slice(lastAssistant + 1).filter(message => message.sender === 'me');
    const batchIds = new Set(batch.map(message => message.id));
    const history = allMessages.filter(message => !batchIds.has(message.id)).slice(-ai.contextCount).map(message => ({role:message.sender === 'me' ? 'user' : 'assistant',content:message.type === 'text' ? message.text : '[历史媒体消息]'}));
    const text = batch.filter(message => message.type === 'text').map(message => message.text).join('\n') || '请分析我刚刚发送的媒体内容，并自然回应。';
    const parts = [{type:'text',text}];
    let imageCount = 0;
    for (const message of batch) {
        const media = mediaById(message.mediaId);
        if (!media || imageCount >= 6) continue;
        if (message.type === 'image') {
            parts.push({type:'image_url',image_url:{url:media.data}}); imageCount++;
        } else if (message.type === 'video') {
            const frameCount = batch.length > 1 ? 2 : 3;
            const sampled = await extractVideoFrames(media,frameCount);
            for (const frame of sampled.frames) {

                parts.push({type:'image_url',image_url:{url:frame}}); imageCount++;
            }
            parts[0].text += `\n视频时长约 ${sampled.duration.toFixed(1)} 秒，以上为按时间抽取的画面。`;
        }
    }
    if (imageCount === 0) throw new Error('没有可发送给视觉模型的图片画面');
    const key = await Native.getApiKey();
    if (!key) throw new Error('尚未填写 API Key');
    const response = await Native.aiRequest(ai.mediaEndpoint || ai.endpoint,key,{model:ai.mediaModel,messages:[{role:'system',content:personaPrompt()},...history,{role:'user',content:parts}],temperature:ai.temperature,max_tokens:ai.maxTokens,stream:false});
    return parseAIResponse(response.code,response.body);
}

function isQuietTime() {
    const ai = state.settings.ai;
    const [startHour,startMinute] = ai.quietStart.split(':').map(Number);
    const [endHour,endMinute] = ai.quietEnd.split(':').map(Number);
    const start = startHour * 60 + startMinute, end = endHour * 60 + endMinute;
    const now = new Date(), current = now.getHours() * 60 + now.getMinutes();
    if (start === end) return false;
    return start < end ? current >= start && current < end : current >= start || current < end;
}

function localMomentComment(moment) {

function scheduleAIInteractions(moment) {
    if (!moment || moment.author !== 'me' || moment.aiInteracted || aiScheduledMoments.has(moment.id)) return;
    const ai = state.settings.ai;
    if (!ai.enabled || (!ai.autoLike && !ai.autoComment)) { moment.aiInteracted = true; persist(); return; }
    aiScheduledMoments.add(moment.id);
    const likeDelay = 2500 + Math.random() * (110 - ai.proactivity) * 90;
    const commentDelay = likeDelay + 4500 + Math.random() * 9000;
    const finish = () => {
        const current = state.moments.find(item => item.id === moment.id);
        if (!current) return;
        const likeDone = !ai.autoLike || current.aiLiked;
        const commentDone = !ai.autoComment || current.aiCommented;
        current.aiInteracted = !!(likeDone && commentDone);
        if (current.aiInteracted) aiScheduledMoments.delete(current.id);
        persist();
        if (['moments','contactMoments'].includes(ui.view)) render();
    };
    if (ai.autoLike) setTimeout(() => {
        const current = state.moments.find(item => item.id === moment.id);
        if (!current || isQuietTime()) { aiScheduledMoments.delete(moment.id); return; }
        current.likes = current.likes || [];
        if (!current.likes.includes('ai')) current.likes.push('ai');
        current.aiLiked = true;
        finish();
    },likeDelay);
    if (ai.autoComment) setTimeout(async () => {
        const current = state.moments.find(item => item.id === moment.id);
        if (!current || isQuietTime()) { aiScheduledMoments.delete(moment.id); return; }
        let comment = '';
        try {
            const mediaCount = current.mediaIds?.length || 0;
            comment = await requestAIText([
                {role:'system',content:personaPrompt() + '\n你现在要以 AI 身份给朋友的朋友圈写一条自然评论。评论控制在 8 到 45 个汉字，不要称呼自己，不要使用列表，不要编造你看到了图片里的具体内容。'},
                {role:'user',content:`朋友圈正文：${current.text || '（无文字）'}\n附件数量：${mediaCount}。请写一条评论。`}
            ],{maxTokens:100,temperature:Math.min(1.2,ai.temperature + 0.2)});
        } catch (error) {
            if (ai.localFallback) comment = localMomentComment(current);
            else console.warn('AI comment skipped',error);
        }
        if (comment) {
            current.comments = current.comments || [];
            current.comments.push({id:uid('comment'),author:'ai',text:comment.replace(/^评论[:：]/,'').trim(),time:Date.now(),localFallback:!comment ? true : undefined});
        }
        current.aiCommented = true;
        finish();
    },commentDelay);
}

    if (!ai.enabled || !ai.proactiveChat || isQuietTime() || ui.aiTypingChats.has('chat_ai')) return;
    if (Math.random() * 100 > Math.max(8,ai.proactivity)) return;
    const now = Date.now(), last = state.lastAIProactive || 0;
    const cooldown = 300000 + (100 - ai.proactivity) * 12000;
    if (now - last < cooldown) return;
    state.lastAIProactive = now;

    try {
        const recent = messagesForChat('chat_ai').slice(-6).map(message => ({role:message.sender === 'me' ? 'user' : 'assistant',content:message.type === 'text' ? message.text : '[媒体消息]'}));
        text = await requestAIText([{role:'system',content:personaPrompt() + '\n请主动开启一段简短对话，一到两句即可，不要反复问在吗。'},...recent,{role:'user',content:'请主动发一条自然的新消息。'}],{maxTokens:100});
    } catch (error) {
        if (ai.localFallback) text = randomItem(['刚想到你，最近过得怎么样？','今天有没有什么让你开心的小事？','这会儿忙不忙？想随便聊两句。']);

    'toggle-chat-mute':(data,element) => { const chat = chatById(ui.params.id); chat.muted = !chat.muted; element.classList.toggle('on',chat.muted); persist(); },
    'clear-chat-history':() => { const chat = chatById(ui.params.id); showConfirm('清空聊天记录','此操作只删除本机记录，且无法恢复。',() => { state.messages = state.messages.filter(message => message.chatId !== chat.id); closeOverlay(); commit(); toast('已清空'); },true,'清空'); },
    'delete-chat':() => { const chat = chatById(ui.params.id); showConfirm('删除会话','将删除该会话及本机聊天记录。',() => { state.chats = state.chats.filter(item => item.id !== chat.id); state.messages = state.messages.filter(message => message.chatId !== chat.id); closeOverlay(); ui.view = 'main'; ui.tab = 'chats'; ui.stack = []; commit(); },true,'删除'); },
    'unavailable':data => toast(`${data.feature || '该功能'}需要真实微信服务，单机版仅保留界面入口`,3200)
};

document.addEventListener('click',async event => {
    const element = event.target.closest('[data-action]');
    if (!element) return;
    const action = element.dataset.action;
    if (action === 'sheet-stop') { event.stopPropagation(); return; }
    event.preventDefault();
    event.stopPropagation();
    const handler = actions[action];
    if (!handler) { console.error('Unhandled action',action); return; }
    try { await handler(element.dataset,element,event); }
    catch (error) { console.error(error); toast(error.message || '操作失败',3500); }
});

const forms = {
    'prompt':form => { const callback = promptCallback; const value = String(new FormData(form).get('value') || ''); closeOverlay(); if (callback) callback(value); },
    'global-search':form => { ui.searchTerm = String(new FormData(form).get('term') || ''); ui.searchSubmitted = true; render(); },
    'favorite-search':form => { ui.favoriteFilter = String(new FormData(form).get('term') || ''); render(); },
    'new-contact':form => {
        const data = new FormData(form), name = String(data.get('name') || '').trim();
        if (!name) return toast('请填写名字');
        const id = uid('contact');
        const tags = String(data.get('tags') || '').split(/[,，]/).map(tag => tag.trim()).filter(Boolean);
        state.contacts.push({id,kind:'person',name,remark:String(data.get('remark') || '').trim(),wxid:String(data.get('wxid') || '').trim() || 'local_' + id.slice(-6),signature:'',color:randomItem(['#5d8aa8','#bf8b56','#9b7fb8','#07c160']),letter:/[a-z]/i.test(name[0]) ? name[0].toUpperCase() : '#',star:false,blocked:false,tags,avatarMediaId:''});
        const chat = {id:uid('chat'),type:'single',contactId:id,name,participants:['me',id],pinned:false,muted:false,unread:0,draft:'',updatedAt:Date.now()};
        state.chats.push(chat); persist(); openChat(chat.id); toast('朋友已添加');
    },
    'new-group':form => {
        const data = new FormData(form), members = data.getAll('members').map(String);
        if (members.length < 2) return toast('请至少选择 2 位联系人');
        const name = String(data.get('name') || '').trim() || members.slice(0,3).map(displayName).join('、') + '的群聊';
        const chat = {id:uid('group'),type:'group',contactId:'',name,participants:['me',...members],pinned:false,muted:false,unread:0,draft:'',updatedAt:Date.now()};
        state.chats.push(chat); persist(); openChat(chat.id); toast('群聊已创建');
    },
    'contact-edit':form => {
        const contact = contactById(form.dataset.id), data = new FormData(form);
        contact.remark = String(data.get('remark') || '').trim();
        contact.tags = String(data.get('tags') || '').split(/[,，]/).map(tag => tag.trim()).filter(Boolean);
        persist(); goBack(); toast('资料已保存');
    },
    'favorite-edit':form => {
        const text = String(new FormData(form).get('text') || '').trim();
        if (!text) return;
        state.favorites.push({id:uid('fav'),type:'note',text,mediaIds:[],source:'手动收藏',createdAt:Date.now()});
        persist(); goBack(); toast('已收藏');
    },
    'ai-settings':async () => { await saveAISettings(true); },
    'profile':form => {
        const data = new FormData(form);
        state.profile.name = String(data.get('name') || '').trim() || '本机用户';
        state.profile.wxid = String(data.get('wxid') || '').trim() || 'local_user';
        state.profile.signature = String(data.get('signature') || '').trim();
        state.profile.region = String(data.get('region') || '').trim() || '本机';
        persist(); goBack(); toast('个人资料已保存');
    }
};
document.addEventListener('submit',async event => {
    const form = event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    const handler = forms[form.dataset.form];
    if (!handler) return;
    try { await handler(form); } catch (error) { console.error(error); toast(error.message || '保存失败',3500); }
});
document.addEventListener('input',event => {
    const target = event.target;
    if (target.id === 'message-input') {
        const chat = activeChat(); if (chat) { chat.draft = target.value; persist(); }
        target.style.height = 'auto'; target.style.height = Math.min(110,target.scrollHeight) + 'px';
    }
    if (target.dataset.input === 'moment-text' && ui.momentDraft) ui.momentDraft.text = target.value;
    if (target.dataset.input === 'moment-location' && ui.momentDraft) ui.momentDraft.location = target.value;
    if (target.dataset.input === 'status-text' && ui.statusDraft) ui.statusDraft.text = target.value;
    if (target.dataset.input === 'proactivity') { const output = document.getElementById('proactivity-value'); if (output) output.textContent = target.value; }
});
document.addEventListener('change',event => {
    const target = event.target;
    if (target.dataset.change === 'moment-visibility' && ui.momentDraft) { ui.momentDraft.visibility = target.value; render(); }
    if (target.dataset.change === 'status-visibility' && ui.statusDraft) ui.statusDraft.visibility = target.value;
    if (target.dataset.change === 'font-scale') { state.settings.fontScale = Number(target.value); commit(); }
});
document.addEventListener('keydown',event => {
    if (event.key === 'Escape') { if (overlayRoot.innerHTML) closeOverlay(); else if (ui.view !== 'main') goBack(); }
    if (event.target.id === 'message-input' && event.key === 'Enter' && !event.shiftKey && state.settings.enterSend) { event.preventDefault(); sendText(); }
});

let longPressTimer = 0;
let longPressFired = false;
function clearLongPress() { clearTimeout(longPressTimer); longPressTimer = 0; }
document.addEventListener('pointerdown',event => {
    if (event.target.closest('#voice-record')) { event.preventDefault(); startVoiceRecording(); return; }
    const target = event.target.closest('[data-longpress]');
    if (!target) return;
    longPressFired = false;
    longPressTimer = setTimeout(() => {
        longPressFired = true;
        if (target.dataset.longpress === 'message') messageActionSheet(target.dataset.chat,target.dataset.id);
        if (target.dataset.longpress === 'chat') {
            const chat = chatById(target.dataset.id); if (!chat) return;
            showSheet(chatName(chat),[{label:chat.pinned ? '取消置顶' : '置顶',action:'quick-chat-pin',data:`data-id="${chat.id}"`},{label:'标为已读',action:'quick-chat-read',data:`data-id="${chat.id}"`},{label:'删除会话',action:'quick-chat-delete',data:`data-id="${chat.id}"`,danger:true}]);
        }
    },550);
});
document.addEventListener('pointerup',event => { clearLongPress(); if (event.target.closest('#voice-record')) { event.preventDefault(); stopVoiceRecording(false); } });
document.addEventListener('pointercancel',() => { clearLongPress(); stopVoiceRecording(true); });
document.addEventListener('pointermove',event => { if (longPressTimer && (Math.abs(event.movementX) + Math.abs(event.movementY) > 8)) clearLongPress(); });
document.addEventListener('click',event => { if (longPressFired) { event.preventDefault(); event.stopPropagation(); longPressFired = false; } },true);
document.addEventListener('contextmenu',event => {
    const target = event.target.closest('[data-longpress]');
    if (!target) return;
    event.preventDefault();
    if (target.dataset.longpress === 'message') messageActionSheet(target.dataset.chat,target.dataset.id);
});
actions['quick-chat-pin'] = data => { const chat = chatById(data.id); if (chat) chat.pinned = !chat.pinned; closeOverlay(); commit(); };
actions['quick-chat-read'] = data => { const chat = chatById(data.id); if (chat) chat.unread = 0; closeOverlay(); commit(); };
actions['quick-chat-delete'] = data => { closeOverlay(); showConfirm('删除会话','将删除该会话及本机聊天记录。',() => { state.chats = state.chats.filter(chat => chat.id !== data.id); state.messages = state.messages.filter(message => message.chatId !== data.id); closeOverlay(); commit(); },true,'删除'); };

async function init() {
    let loaded = null;
    try {
        database = await openDatabase();
        loaded = await dbGet('state');
    } catch (error) {
        console.warn('IndexedDB unavailable, using localStorage',error);
        storageFallback = true;
        try { loaded = JSON.parse(localStorage.getItem('local_wechat_state') || 'null'); } catch (parseError) { loaded = null; }
    }
    state = migrateState(loaded);
    syncAIIdentity();
    render();
    persist();
    if (hasIOS) window.webkit.messageHandlers.localBridge.postMessage({action:'setTheme',theme:state.settings.theme});
    startAIProactiveLoop();
    window.__LOCAL_WECHAT_READY__ = true;
}
init().catch(error => {
    console.error(error);
    appEl.innerHTML = `<div class="empty"><div class="empty-title">应用初始化失败</div><div>${esc(error.message)}</div><button class="primary-btn" onclick="location.reload()">重新加载</button></div>`;
});
</script>
</body>
</html>
